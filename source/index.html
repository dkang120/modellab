function modelStats(m){
  var keys=['d1','w1','mtd','ytd','y1'],out={cov:0};
  keys.forEach(function(k){out[k]=0;});
  m.hold.forEach(function(x){var st=stats(x[0]);if(!st)return;out.cov+=x[2];keys.forEach(function(k){out[k]+=x[2]*st[k];});});

}

function donut(m){
  var R=45,C=2*Math.PI*R,cum=0,s='<svg viewBox="0 0 120 120" role="img" aria-label="Allocation of '+esc(m.name)+'"><circle cx="60" cy="60" r="'+R+'" fill="none" stroke="#ebe7dd" stroke-width="26"/>';
  var tot=m.hold.reduce(function(a,h){return a+h[2];},0);
  m.hold.forEach(function(h,i){var len=h[2]/tot*C;s+='<circle cx="60" cy="60" r="'+R+'" fill="none" stroke="'+HC[i%HC.length]+'" stroke-width="26" stroke-dasharray="'+Math.max(0,len-1.2)+' '+(C-Math.max(0,len-1.2))+'" stroke-dashoffset="'+(-cum)+'"/>';cum+=len;});
  return '<div class="donut">'+s+'</svg><div class="mid"><b>'+m.hold.length+'</b><span>holdings</span></div></div>';
}

function rankFit(){
  var f=state.fit,names={risk:'risk',effort:'effort',growth:'growth'};
  return MODELS.map(function(m){
    var d={risk:Math.abs(m.risk-f.risk),effort:Math.abs(m.effort-f.effort),growth:Math.abs(m.growth-f.growth)};
    var tot=Math.sqrt(d.risk*d.risk+d.effort*d.effort+d.growth*d.growth);
    var ks=Object.keys(d).sort(function(a,b){return d[a]-d[b];});
    var why=tot===0?'Matches your profile exactly':'Closest on '+names[ks[0]]+' and '+names[ks[1]];
    if(d[ks[2]]>=2)why+='; '+(ks[2]==='effort'?(m.effort>f.effort?'more effort than you want':'less effort than you want'):ks[2]==='risk'?(m.risk>f.risk?'higher risk than you want':'lower risk than you want'):(m.growth>f.growth?'more growth than you want':'less growth than you want'));
    return {m:m,tot:tot,why:why};
  }).sort(function(a,b){return a.tot-b.tot;}).slice(0,3);
}

}

var BASE=new URL('.',document.baseURI).pathname,TOOLN=['match','pain','stress','implement','overlap','build'];
function fromPath(p){p=(p||'').replace(/^\/+|\/+$/g,'');if(!p)return '#home';if(p.indexOf('models/')===0)return '#m-'+p.slice(7);if(p.indexOf('tools/')===0&&p.length>6)return '#'+p.slice(6);return '#'+p;}
function toPath(h){h=(h||'').replace(/^#/,'');if(!h||h==='home')return '';if(h.indexOf('m-')===0)return 'models/'+h.slice(2)+'/';var n=h.split('/')[0];return (TOOLN.indexOf(n)>-1?'tools/':'')+h.replace(/\/+$/,'')+'/';}
function curH(){var p=decodeURIComponent(location.pathname).slice(BASE.length);if(!p.replace(/\//g,'')&&location.hash.length>1)return location.hash;return fromPath(p);}
function go(h,replace){var u=BASE+toPath(h);if(location.pathname===u&&!location.hash){render();return;}history[replace?'replaceState':'pushState'](null,'',u);state.menu=false;render();}
function fixLinks(){document.querySelectorAll('a[href^="#"]').forEach(function(a){var h=a.getAttribute('href');if(h.length>1||h==='#home')a.setAttribute('href',BASE+toPath(h));});}
(function(){var h=location.hash;if(h.length>1&&!decodeURIComponent(location.pathname).slice(BASE.length).replace(/\//g,''))history.replaceState(null,'',BASE+toPath(h));})();
/* ---------- glossary: first mention of a term on a page gets a tap-for-definition ---------- */
var GLOSS=[
['drawdown','How far a portfolio has fallen from its highest point, before it recovers. A 30% drawdown means it lost 30% from the peak.'],
['rebalancing','Selling a little of what grew and buying what lagged, to get back to your target split.'],
['rebalance','Selling a little of what grew and buying what lagged, to get back to your target split.'],
['expense ratio','The yearly fee a fund charges, as a percent of the money you have in it.'],
['diversification','Spreading money across different investments so one bad one hurts less.'],
['ETF','Exchange-traded fund: a basket of investments you can buy or sell like a single stock.'],
['ETFs','Exchange-traded funds: baskets of investments you can buy or sell like a single stock.'],
['CAGR','Compound annual growth rate: the steady yearly return that would produce the same ending value.'],

];
var glPop=null;
function glossary(){
  var root=document.getElementById('view');if(!root)return;var used={};
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
    if(!n.nodeValue||n.nodeValue.length<4)return NodeFilter.FILTER_REJECT;
    var p=n.parentNode;if(!p||!p.closest||p.closest('a,button,select,textarea,input,label,h1,h2,h3,th,.mdl,.chip,.tl-opt,.tl-hit,.menu,.tl-dec,svg,script,style,.gl,.mm-page,.faq summary'))return NodeFilter.FILTER_REJECT;
    return p.closest('p,li,td,span.w,.note')?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}}),nodes=[],n;
  while((n=w.nextNode()))nodes.push(n);
  nodes.forEach(function(node){
    GLOSS.forEach(function(g){var k=g[0].toLowerCase();if(used[k]||!node.parentNode)return;
      var re=new RegExp('(^|[^A-Za-z])('+g[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![A-Za-z])',g[0]==='ETF'||g[0]==='CAGR'||g[0]==='ETFs'?'':'i'),m=re.exec(node.nodeValue);
      if(!m)return;used[k]=1;if(k==='rebalance')used['rebalancing']=1;if(k==='rebalancing')used['rebalance']=1;if(k==='etf')used['etfs']=1;if(k==='etfs')used['etf']=1;
      var i=m.index+m[1].length,t=node.nodeValue,b=document.createElement('button');b.type='button';b.className='gl';b.setAttribute('data-gl',g[1]);b.setAttribute('aria-expanded','false');b.textContent=t.substr(i,m[2].length);
      var after=document.createTextNode(t.slice(i+m[2].length));node.nodeValue=t.slice(0,i);node.parentNode.insertBefore(b,node.nextSibling);node.parentNode.insertBefore(after,b.nextSibling);node=after;});
  });
}
function glClose(){if(glPop){glPop.remove();glPop=null;}document.querySelectorAll('.gl[aria-expanded=true]').forEach(function(b){b.setAttribute('aria-expanded','false');});}
function glOpen(b){glClose();var p=document.createElement('div');p.className='gl-pop';p.setAttribute('role','tooltip');p.innerHTML='<b>'+esc(b.textContent)+'</b> '+esc(b.getAttribute('data-gl'));document.body.appendChild(p);
  var r=b.getBoundingClientRect(),pw=p.offsetWidth,x=Math.max(12,Math.min(window.innerWidth-pw-12,r.left+r.width/2-pw/2)),above=r.top>p.offsetHeight+24;
  p.style.left=(x+window.scrollX)+'px';p.style.top=((above?r.top-p.offsetHeight-8:r.bottom+8)+window.scrollY)+'px';b.setAttribute('aria-expanded','true');glPop=p;}
var ROUTES={};
var view=$('#view'),foot=$('#foot');
function render(keep){
  var hash=curH().slice(1),html,nav='',home=false;
  var rt=routeFor(curH());
  if(window.ML&&ML.routes.__leave)ML.routes.__leave();
  if(rt){if(rt.r.before)rt.r.before(rt.arg);html=rt.r.view(rt.arg);nav=rt.r.nav||'';}
  else if(hash==='library'){html=viewLibrary();nav='library';}
  else if(hash==='compare'){html=viewCompare();nav='compare';}
  else if(hash==='about'){html=viewAbout();}
  else if(hash.indexOf('m-')===0){html=viewModel(hash.slice(2));nav='library';}
  else{html=viewHome();home=true;}
  heroStop();view.className=home?'':'page';view.innerHTML=(home?'':navrow())+html;foot.innerHTML=footer(home);if(home)heroStart();
  document.body.classList.toggle('home',home);fixLinks();glClose();if(!home)glossary();
  if(window.seoFor){var sx=seoFor(curH(),MODELS),dm=document.querySelector('meta[name=description]');document.title=sx.title;if(dm)dm.setAttribute('content',sx.desc);}
  document.querySelectorAll('[data-nav]').forEach(function(a){a.classList.toggle('on',a.getAttribute('data-nav')===nav);});
  if(!keep)window.scrollTo(0,0);
  if(rt&&rt.r.after)rt.r.after(rt.arg);
}
function routeFor(h){h=(h||'').replace(/^#/,'');var p=h.split('/'),r=ROUTES[p[0]];return (r&&typeof r==='object'&&p[0].charAt(0)!=='_')?{r:r,arg:p.slice(1).join('/')}:null;}
function rerender(){var y=window.scrollY;render(true);window.scrollTo(0,y);}
document.addEventListener('click',function(e){
  var t=e.target;
  var glb=t.closest&&t.closest('.gl');if(glb){glOpen(glb);return;}if(glPop&&!(t.closest&&t.closest('.gl-pop')))glClose();
  var ln=t.closest&&t.closest('a[href]');
  if(ln&&!ln.target&&e.button===0&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey){var hr=ln.getAttribute('href'),u=new URL(ln.href,location.href);
    if(hr.charAt(0)==='#'&&hr.length>1){e.preventDefault();go(hr);return;}
    if(u.origin===location.origin&&u.pathname.indexOf(BASE)===0&&!/\.[a-z0-9]+$/i.test(u.pathname)&&!u.hash){e.preventDefault();go(fromPath(decodeURIComponent(u.pathname).slice(BASE.length)));return;}}
  var chip=t.closest('[data-chip]');if(chip){state.cat=chip.getAttribute('data-chip');rerender();return;}
  var st=t.closest('[data-step]');if(st){state.step=Number(st.getAttribute('data-step'));rerender();return;}
  var mn=t.closest('[data-menu]');if(mn){state.menu=!state.menu;rerender();return;}
  var cmp=t.closest('[data-cmp]');
  if(cmp){
    var id=cmp.getAttribute('data-cmp'),i=state.compare.indexOf(id);
    if(i>-1)state.compare.splice(i,1);else{if(state.compare.length>=MAXCMP)state.compare.shift();state.compare.push(id);}
    state.menu=false;rerender();return;
  }
  if(state.menu&&!t.closest('.menu')){state.menu=false;if(curH()==='#compare')rerender();}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.hasAttribute&&t.hasAttribute('data-fit')){var k=t.getAttribute('data-fit');state.fit[k]=Number(t.value);t.style.setProperty('--p',((t.value-1)*25)+'%');$('#v-'+k).textContent=t.value+'/5';$('#rank').innerHTML=rankHtml();}
  if(t.id==='amt'){state.amount=Math.max(0,Number(t.value)||0);var id=curH().slice(3);if(byId[id]){$('#hold').innerHTML=holdRows(byId[id]);var cr=$('#calcres');if(cr)cr.innerHTML=valueInner(byId[id]);}}
});
document.addEventListener('submit',function(e){
  var f=e.target.closest&&e.target.closest('form[data-signup]');if(!f)return;
  e.preventDefault();
  var email=(f.querySelector('input[name=email]').value||'').trim(),msg=f.parentNode.querySelector('.signup-msg'),btn=f.querySelector('button');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){msg.textContent='Please enter a valid email address.';return;}
  msg.textContent='';btn.disabled=true;btn.textContent='One moment\u2026';
  function done(){try{localStorage.setItem('ml_email',email);}catch(x){}setUnlocked();rerender();}
  function fail(){btn.disabled=false;btn.textContent='Unlock free access \u2192';msg.textContent='Could not sign you up right now. Please try again.';}
  if(!SIGNUP.companyId||!SIGNUP.listId){console.warn('ModelLab: SIGNUP not configured, email was not saved.');done();return;}
  fetch('https://a.klaviyo.com/client/subscriptions/?company_id='+encodeURIComponent(SIGNUP.companyId),{
    method:'POST',headers:{'Content-Type':'application/json','revision':'2024-10-15'},
    body:JSON.stringify({data:{type:'subscription',attributes:{custom_source:'ModelLab site ('+f.getAttribute('data-signup')+')',profile:{data:{type:'profile',attributes:{email:email}}}},relationships:{list:{data:{type:'list',id:SIGNUP.listId}}}}})
  }).then(function(r){if(r.status===202||r.ok)done();else fail();}).catch(fail);
});
document.addEventListener('change',function(e){if(e.target.id==='sort'){state.sort=e.target.value;rerender();}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')glClose();if(e.key==='Escape'&&state.menu){state.menu=false;rerender();}});
window.addEventListener('hashchange',function(){if(location.hash.length>1){history.replaceState(null,'',BASE+toPath(location.hash));}state.menu=false;render();});
window.addEventListener('popstate',function(){state.menu=false;render();});
window.ML={MODELS:MODELS,byId:byId,routes:ROUTES,routeFor:routeFor,data:function(){return DATA;},srcTxt:srcTxt,unlocked:unlocked,gatePanel:gatePanel,rerender:rerender,signup:SIGNUP,curH:curH,go:go,esc:esc,money:money,fmt:fmt,chg:chg,sign:sign,$:$};
render();
loadLive();

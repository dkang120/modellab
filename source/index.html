<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ModelLab: every investing model, built as a portfolio</title>
<meta name="description" content="Explore investing philosophies as example portfolios, with price snapshots, a dollar calculator and side-by-side comparisons. Educational only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fbfaf6; --lav:#e4dafb; --lav-soft:#f3eefc; --ink:#3e3a32; --muted:#7c766a;
  --purple:#7c4def; --purple-deep:#5b33c9; --white:#fff; --line:#e9e4d9;
  --blue:#e6eef6; --peach:#f7e6de; --mint:#dff0e6; --lilac:#ece5fb; --yellow:#fbefc8;
  --up:#2f9e6e; --down:#d2604a;
  --font:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 8px 28px rgba(61,58,50,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--ink);font-size:16px;line-height:1.5;
  background:var(--cream) linear-gradient(180deg,var(--lav) 0,var(--cream) 520px) no-repeat;background-size:100% 520px;-webkit-font-smoothing:antialiased}
body.home{background-image:linear-gradient(180deg,var(--lav) 0,var(--cream) 820px);background-size:100% 820px}
body.dark{background:#171614;color:#f2efe8}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--purple);outline-offset:3px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
/* nav */
.navbar{position:sticky;top:14px;z-index:20;padding-top:14px}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px;padding:0 12px 0 28px;background:var(--white);border-radius:999px;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;font-size:22px;letter-spacing:-.02em}
.logo svg{width:26px;height:26px}
.nav-links{display:flex;align-items:center;gap:36px}
.nav-links a.l{text-decoration:none;color:var(--muted);font-weight:500;font-size:17px}
.nav-links a.l:hover,.nav-links a.l.on{color:var(--ink)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:14px 26px;font-weight:600;font-size:16px;text-decoration:none;border:1.5px solid transparent;cursor:pointer;transition:transform .12s ease}
.btn:hover{transform:translateY(-1px)}
.btn.pri{background:var(--purple);color:#fff;border-bottom:4px solid var(--purple-deep)}
.btn.light{background:var(--white);border-color:var(--line);color:var(--ink)}
.btn.sm{padding:10px 20px;font-size:15px}
.btn.lg{padding:18px 34px;font-size:18px}
.btn[aria-pressed=true]{border-color:var(--purple);color:var(--purple)}
/* type */
.display{font-size:clamp(40px,6vw,72px);font-weight:700;letter-spacing:-.045em;line-height:1.02}
.h2{font-size:clamp(32px,4.4vw,48px);font-weight:700;letter-spacing:-.04em;line-height:1.1;text-align:center}
.h2 em,.display em{font-style:normal;color:var(--purple)}
.sub{color:var(--muted);font-size:20px}
.center{text-align:center}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
/* hero */
.hero{display:grid;grid-template-columns:1.12fr .88fr;gap:40px;align-items:center;padding:72px 0 40px}
.hero .sub{margin-top:24px;max-width:470px;font-size:19px}
.hero .cta{margin-top:34px;display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.hero small{color:var(--muted);font-size:14px}
.demo{background:var(--white);border-radius:24px;box-shadow:var(--shadow);padding:28px 30px;display:flex;flex-direction:column;gap:18px}
.demo-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.demo-h h3{font-size:24px;font-weight:700;letter-spacing:-.02em}
.demo-h p{font-size:13px;color:var(--muted);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.pill.up{background:var(--mint);color:var(--up)}.pill.dn{background:var(--peach);color:var(--down)}.pill.na{background:var(--lilac);color:var(--muted)}
.hrow{display:grid;grid-template-columns:96px 1fr 44px 56px;gap:14px;align-items:center;font-size:13px}
.hrow b{display:block;font-size:15px;font-weight:600}
.hrow span.s{color:var(--muted);font-size:11.5px}
.bar{height:8px;border-radius:6px;background:#ebe7dd;overflow:hidden}.bar i{display:block;height:100%;background:var(--purple);border-radius:6px}
.hrow .w{text-align:right;font-weight:600;font-size:14px}.hrow .c{text-align:right;font-size:13px}
.up{color:var(--up)}.dn{color:var(--down)}
.demo-f{border-top:1px solid var(--line);padding-top:18px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px}
.demo-f b{color:var(--ink);font-size:24px;letter-spacing:-.02em}
.ideas{text-align:center;padding:40px 0 80px}
.ideas .names{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 48px;margin-top:20px;font-size:24px;font-weight:700;letter-spacing:-.02em;color:#b8b2a6}
/* sections */
section.s{padding:84px 0}
.simple{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;margin-top:64px}
.steps{display:flex;flex-direction:column;gap:30px}
.step{border-left:3px solid var(--line);padding:2px 0 2px 20px;cursor:pointer;background:none;border-top:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.step h3{font-size:22px;font-weight:600;color:#a39d90;letter-spacing:-.01em}
.step p{font-size:15px;color:#a39d90;margin-top:6px;max-width:340px}
.step.on{border-left-color:var(--ink)}.step.on h3{color:var(--ink)}.step.on p{color:var(--muted)}
.libcard{background:var(--white);border-radius:24px;box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:10px}
.libcard>b{font-size:18px;margin-bottom:4px}
.lrow{display:flex;justify-content:space-between;align-items:center;border-radius:14px;padding:12px 16px;text-decoration:none}
.lrow strong{display:block;font-size:16px}.lrow span.s{font-size:12px;color:var(--muted)}
.bento{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:48px}
.bcard{border-radius:24px;padding:30px;display:flex;flex-direction:column;gap:14px}
.bcard h3{font-size:24px;font-weight:700;letter-spacing:-.025em}
.bcard>p{font-size:15px;color:var(--muted)}
.mini{background:var(--white);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;font-size:15px;font-weight:500}
.mini b{font-weight:700}.mini .c{font-size:13px}
.cbar{font-size:13px;font-weight:500;display:flex;flex-direction:column;gap:6px}
.cbar .bar{background:#fff;height:9px}
/* cards */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.mcard{display:flex;flex-direction:column;align-items:flex-start;gap:12px;border-radius:24px;padding:28px;text-decoration:none;transition:transform .15s ease,box-shadow .15s ease;box-shadow:0 2px 8px rgba(61,58,50,.04)}
.mcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.mcard .cat{background:#fff;color:var(--purple-deep);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:500}
.mcard h3{font-size:30px;font-weight:700;letter-spacing:-.035em;line-height:1.1}
.mcard p{font-size:15px;color:var(--muted)}
.mcard .meters{display:flex;gap:18px;font-size:13px;font-weight:500;flex-wrap:wrap}
.mcard .go{color:var(--purple);font-weight:600;font-size:15px;margin-top:auto}
.dots{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);display:block}
.dots i.f{background:var(--ink)}
.dots.p i{border-color:var(--purple)}.dots.p i.f{background:var(--purple)}
.dots.big i{width:14px;height:14px}
/* faq */
.faq{max-width:860px;margin:44px auto 0;display:flex;flex-direction:column;gap:14px}
.faq details{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:22px 28px}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:600;letter-spacing:-.01em}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:'+';font-size:26px;color:var(--purple);font-weight:500;line-height:1}
.faq details[open] summary::after{content:'−'}
.faq details p{margin-top:12px;color:var(--muted);font-size:16px;max-width:760px}
/* cta */
.ctaband{background:linear-gradient(180deg,var(--cream) 0,var(--lav) 100%);padding:110px 0 70px;text-align:center}
.ctaband .btn{margin-top:36px}
.ctaband small{display:block;margin-top:22px;color:var(--muted);font-size:14px}
/* footer */
footer{background:var(--cream);border-top:1px solid var(--line)}
footer .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:40px;padding-bottom:40px;font-size:14px;color:var(--muted);flex-wrap:wrap}
footer .fl{display:flex;gap:32px}footer a{text-decoration:none}footer a:hover{color:var(--ink)}
/* page header */
.phead{text-align:center;padding:56px 0 48px}
.phead .display{font-size:clamp(44px,6vw,72px);letter-spacing:-.045em}
.phead .sub{margin-top:16px}
.mhead{padding:30px 0 44px}
.crumb{font-size:15px;color:var(--muted)}.crumb a{text-decoration:none}.crumb a:hover{color:var(--ink)}
.mhead h1{font-size:clamp(56px,9vw,88px);font-weight:700;letter-spacing:-.05em;line-height:1;margin:34px 0 14px}
.mhead .sub{font-size:24px;max-width:760px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:34px}
.fact{background:var(--white);border-radius:18px;padding:18px 22px;display:flex;flex-direction:column;gap:6px}
.fact small{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fact b{font-size:22px;font-weight:700}
.stack{display:flex;flex-direction:column;gap:24px;padding-bottom:100px}
.panel{background:var(--white);border-radius:24px;padding:32px}
.panel.sh{box-shadow:var(--shadow)}
.panel h2{font-size:28px;font-weight:700;letter-spacing:-.035em}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.perf{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:16px}
.pt{border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.pt small{font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--muted)}
.pt b{font-size:26px;font-weight:700;letter-spacing:-.02em}
.pt.up{background:var(--mint)}.pt.dn{background:var(--peach)}.pt.na{background:var(--cream)}
.note{font-size:13px;color:var(--muted);margin-top:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.two>.panel{display:flex;flex-direction:column;gap:14px}
.panel p.b{color:var(--muted);font-size:17px;line-height:1.6}
.nstep{display:flex;gap:14px;align-items:flex-start;color:var(--muted);font-size:16px;line-height:1.5}
.nstep i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--purple);color:#fff;font-style:normal;font-weight:700;font-size:14px;display:grid;place-items:center}
.pb{display:grid;grid-template-columns:240px 1fr;gap:56px;align-items:center;margin-top:24px}
.donut{position:relative;width:240px;height:240px}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .mid b{font-size:44px;line-height:1}.donut .mid span{font-size:14px;color:var(--muted)}
.calc{display:flex;align-items:center;gap:14px;background:var(--cream);border:1.5px solid var(--line);border-radius:14px;padding:10px 18px;font-size:14px;color:var(--muted)}
.calc input{border:0;background:transparent;font:inherit;font-size:20px;font-weight:700;color:var(--ink);width:110px;text-align:right;outline:0}
.calc:focus-within{border-color:var(--purple)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--muted);text-align:right;padding:0 0 10px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:16px 0;border-bottom:1px solid var(--line);text-align:right;font-size:15px;vertical-align:middle}
td.m{font-weight:500}
.hn{display:flex;gap:12px;align-items:center}.hn i{width:12px;height:12px;border-radius:50%;flex:none}
.hn b{display:block;font-size:17px;font-weight:600}.hn span{font-size:12px;color:var(--muted)}
.pc h3{font-size:24px;font-weight:700;letter-spacing:-.025em}
.pc ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.pc li{display:flex;gap:12px;color:var(--muted);font-size:16px}
.pc li::before{content:'•';font-weight:700}
.pc.g{background:var(--mint)}.pc.g h3,.pc.g li::before{color:var(--up)}
.pc.r{background:var(--peach)}.pc.r h3,.pc.r li::before{color:var(--down)}
.wb h3{font-size:22px;font-weight:700}.wb p{color:var(--muted);font-size:16px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.pager{display:flex;justify-content:space-between;gap:12px}
/* library */
.filters{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:40px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border-radius:999px;padding:10px 18px;font-size:15px;font-weight:500;background:var(--white);border:1.5px solid var(--line);color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.sortw{display:flex;align-items:center;gap:6px;border-radius:999px;border:1.5px solid var(--line);background:var(--white);padding:0 14px 0 18px;font-size:15px;font-weight:500;height:44px}
.sortw select{border:0;background:transparent;font:inherit;color:var(--ink);font-weight:500;cursor:pointer;outline:0;padding:8px 0}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px}
/* compare */
.sel{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:28px;position:relative}
.sel>span{font-size:15px;color:var(--muted)}
.cp{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:999px;padding:10px 12px 10px 18px;font-size:15px;font-weight:500;border:0}
.cp i{font-style:normal;opacity:.7;font-size:13px}
.addm{border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--purple);padding:10px 18px;font-weight:500;font-size:15px}
.menu{position:absolute;top:52px;right:auto;left:130px;background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:8px;z-index:6;display:grid;grid-template-columns:repeat(2,1fr);gap:2px;max-height:320px;overflow:auto;min-width:320px}
.menu button{background:none;border:0;text-align:left;padding:10px 14px;border-radius:12px;font-size:15px}
.menu button:hover{background:var(--lilac)}
.ct{background:var(--white);border-radius:24px;box-shadow:var(--shadow);padding:10px 0 4px;overflow-x:auto}
.ct table{min-width:760px;table-layout:fixed}
.ct th,.ct td{text-align:left;padding:18px 12px;border-top:1px solid var(--line);border-bottom:0;font-size:16px}
.ct thead th{border-top:0;font-size:22px;letter-spacing:-.02em;color:var(--ink);font-weight:700}
.ct th:first-child,.ct td:first-child{padding-left:28px;color:var(--muted);font-weight:500;font-size:15px;width:190px}
.ct thead th:first-child{color:var(--muted);font-size:13px}
.ct td{font-weight:500}.ct td.v{font-weight:600}
.ct thead a{text-decoration:none}
.fit{display:grid;grid-template-columns:1fr 1fr;gap:40px;background:var(--lilac);border-radius:24px;padding:36px}
.fit h2{font-size:32px;font-weight:700;letter-spacing:-.04em}
.fit>div>p{color:var(--muted);margin:14px 0 20px;max-width:420px}
.sl{margin-bottom:18px}
.sl label{display:flex;justify-content:space-between;font-size:15px;font-weight:500;margin-bottom:8px}
.sl label span{color:var(--purple);font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:6px;background:linear-gradient(to right,var(--purple) var(--p,50%),#fff var(--p,50%));outline-offset:6px;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--purple);cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--purple);cursor:pointer}
.bm small{display:block;font-size:14px;font-weight:600;letter-spacing:.1em;color:var(--muted);margin-bottom:14px}
.rk{display:flex;align-items:center;gap:16px;background:#fff;border-radius:16px;padding:16px 20px;text-decoration:none;margin-bottom:12px}
.rk .n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px}
.rk div{flex:1}.rk b{display:block;font-size:18px;font-weight:600}.rk span.w{font-size:13px;color:var(--muted)}
.rk .v{color:var(--purple);font-weight:600;font-size:14px;flex:none}
/* about */
.about{max-width:820px;margin:0 auto;padding-bottom:100px;display:flex;flex-direction:column;gap:24px}
.about .panel h2{font-size:26px;margin-bottom:12px}
.about ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--muted)}
/* responsive */
@media(max-width:960px){
  .hero,.simple,.fit{grid-template-columns:1fr}
  .bento,.grid3{grid-template-columns:1fr 1fr}
  .two{grid-template-columns:1fr}
  .pb{grid-template-columns:1fr;gap:28px}.donut{margin:0 auto}
  .perf{grid-template-columns:repeat(3,1fr)}
  .facts{grid-template-columns:repeat(2,1fr)}
  .nav-links{gap:18px}
}
@media(max-width:640px){
  .wrap{padding:0 16px}
  .nav{padding-left:18px;height:60px}.nav-links a.l{display:none}
  .bento,.grid3{grid-template-columns:1fr}
  .hero{padding-top:40px}
  section.s{padding:56px 0}
  .menu{left:0;grid-template-columns:1fr;min-width:0;width:100%}
  .panel{padding:22px}
  .pt b{font-size:22px}
  footer .wrap{flex-direction:column;align-items:flex-start}
}
.gatebox{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--lilac)!important}
.gatebox h2{font-size:26px}
.gatebox>p{color:var(--muted);max-width:460px}
.signup{display:flex;gap:10px;width:100%;max-width:480px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.signup input[type=email]{flex:1;min-width:220px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:14px 20px;font:inherit;font-size:16px;color:var(--ink);outline:0}
.signup input[type=email]:focus{border-color:var(--purple)}
.signup .btn{flex:none}
.signup-note{font-size:12.5px;color:var(--muted);max-width:420px}
.signup-msg{font-size:14px;color:var(--down);min-height:20px}
.lk{color:#b8b2a6;letter-spacing:.1em;font-weight:500}
.mini .lk{font-size:13px;letter-spacing:0}
.cgate{max-width:640px;margin:0 auto 110px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<script>
(function(){
var MODELS=[

function pc(a,b){return (a&&b)?(a/b-1)*100:null;}
function stats(t){
  var d=DATA&&DATA.tickers&&DATA.tickers[t];if(!d)return null;
  var m=d.m||[];
  return {last:d.last,d1:pc(d.last,d.d1),w1:pc(d.last,d.w1),mtd:pc(d.last,m[DATA.mtdIdx]),ytd:pc(d.last,m[DATA.ytdIdx]),y1:pc(d.last,m[0])};
}
function modelStats(m){
  var keys=['d1','w1','mtd','ytd','y1'],out={cov:0};
  keys.forEach(function(k){out[k]=0;});
  m.hold.forEach(function(x){var st=stats(x[0]);if(!st)return;out.cov+=x[2];keys.forEach(function(k){out[k]+=x[2]*st[k];});});
  if(!out.cov)return null;
  keys.forEach(function(k){out[k]=out[k]/out.cov;});
  return out;
}

    return '<div class="hrow"><div><b>'+esc(x[0])+'</b><span class="s">'+esc(x[1])+'</span></div><div class="bar"><i style="width:'+Math.min(100,x[2]*1.6)+'%"></i></div><div class="w">'+pctTxt(x[2])+'</div><div class="c">'+(st?chg(st.d1):'')+'</div></div>';}).join('');
  var d1=(ms&&unlocked())?'<span class="pill '+sign(ms.d1)+'">1D '+fmt(ms.d1)+'</span>':'';
  var lib=['index','value','dividend','momentum','all-weather'].map(function(id){var m=byId[id];
    return '<a class="lrow" style="background:var(--'+m.color+')" href="#m-'+m.id+'"><div><strong>'+esc(m.name)+'</strong><span class="s">'+esc(m.cat)+'</span></div>'+dots(m.risk,'p')+'</a>';}).join('');
  var steps=[['Pick a philosophy','Value, growth, dividend, all-weather and more, each explained in plain language.'],['See the portfolio','Every model has an example allocation, a donut chart, and a dollar calculator.'],['Compare side by side','Line up to four models on risk, effort, and growth, then see which fits you best.']];
  var stepHtml=steps.map(function(s,i){return '<button class="step'+(state.step===i?' on':'')+'" data-step="'+i+'"><h3>'+s[0]+'</h3><p>'+s[1]+'</p></button>';}).join('');
  var tick=['VTI','QQQ','TLT','GLD'].map(function(t){var st=stats(t);return '<div class="mini"><b>'+t+'</b><span>'+(!unlocked()?'<a class="lk" href="#compare" style="text-decoration:none">Sign up to view</a>':(st?'$'+st.last.toFixed(2)+' &nbsp;<span class="c">'+chg(st.d1)+'</span>':'n/a'))+'</span></div>';}).join('');
  var cb=['index','value','momentum'].map(function(id){var m=byId[id];return '<div class="cbar">'+esc(m.name)+' · risk '+m.risk+'/5<div class="bar"><i style="width:'+(m.risk*20)+'%"></i></div></div>';}).join('');
  var ix=byId['index'];
  var calc=ix.hold.map(function(x){return '<div class="mini" style="background:transparent;padding:6px 16px;color:var(--muted)"><b style="color:var(--ink);font-weight:600">'+esc(x[0])+' '+x[2]+'%</b><span>'+money(10000*x[2]/100)+'</span></div>';}).join('');
  var feat=['index','value','all-weather'].map(function(id){return card(byId[id]);}).join('');
  var faq=[['Is this investment advice?','No. ModelLab is educational. Every allocation is a hypothetical example using public funds, not a recommendation or a record of performance.'],
    ['Where do the prices come from?','Closing prices come from a snapshot of brokerage quote data. The change figures are price only, so they leave out dividends, fees and rebalancing. The date of the latest close is shown next to every figure.'],
    ['What do Risk and Effort mean?','They are 1 to 5 editorial ratings written by the site’s author, not measured data. Risk is how bumpy the ride can get. Effort is how much time and attention the style asks of you.'],
    ['Can I try my own amounts?','Yes. On any model page, type a dollar amount into the calculator to see how it would split across that model’s holdings.']]
    .map(function(q,i){return '<details'+(i===0?' open':'')+'><summary>'+q[0]+'</summary><p>'+q[1]+'</p></details>';}).join('');
  return '<div class="wrap"><section class="hero"><div><h1 class="display">Every investing model, <em>built as a portfolio.</em></h1>'+
    '<p class="sub">Explore investing philosophies with example allocations, price snapshots, and side-by-side comparisons.</p>'+
    '<div class="cta"><a class="btn pri lg" href="#library">Explore the library →</a><small>Free to browse · prices from the latest close</small></div></div>'+
    '<div class="demo"><div class="demo-h"><div><h3>Value</h3><p>Example portfolio'+(DATA?' · '+asOfTxt()+' close':'')+'</p></div>'+d1+'</div>'+heroRows+
    '<div class="demo-f"><span>If I invested</span><b>$10,000</b></div></div></section>'+
    '<div class="ideas"><span class="eyebrow">Built from the ideas of</span><div class="names"><span>Graham</span><span>Buffett</span><span>Lynch</span><span>Bogle</span><span>Dalio</span><span>Markowitz</span><span>Fama</span></div></div>'+
  '<section class="s"><h2 class="h2">ModelLab makes investing styles <em>simple.</em></h2><div class="simple"><div class="steps">'+stepHtml+'</div><div class="libcard"><b>Library</b>'+lib+'</div></div></section>'+
  '<section class="s" style="padding-top:20px"><h2 class="h2">But wait, there’s more</h2><p class="sub center" style="font-size:17px;margin-top:14px">Price snapshots, a dollar calculator, and a compare view, built into every model.</p>'+
    '<div class="bento"><div class="bcard" style="background:var(--blue)"><h3>Prices that stay current</h3><p>Closing prices and daily change for every ETF, from the latest market close.</p>'+tick+'</div>'+
    '<div class="bcard" style="background:var(--peach)"><h3>Compare up to four</h3><p>Risk, effort, and growth profiles drawn side by side so the tradeoffs are obvious.</p>'+cb+'</div>'+
    '<div class="bcard" style="background:var(--mint)"><h3>A dollar calculator</h3><p>Type any amount and watch it split across the holdings of each model.</p><div class="mini"><span style="color:var(--muted);font-weight:400;font-size:14px">If I invested</span><b style="font-size:20px">$10,000</b></div>'+calc+'</div></div></section>'+
  '<section class="s" style="padding-top:20px"><h2 class="h2">Find your style.</h2><div class="grid3" style="margin-top:44px">'+feat+'</div><div class="center" style="margin-top:36px"><a class="btn light" href="#library">See all models →</a></div></section>'+
  '<section class="s"><h2 class="h2">Frequently asked questions</h2><p class="sub center" style="font-size:17px;margin-top:14px">Everything you need to know about ModelLab</p><div class="faq">'+faq+'</div></section></div>'+
  '<section class="ctaband"><div class="wrap"><h2 class="h2" style="max-width:700px;margin:0 auto">Find the model that fits how you invest.</h2><a class="btn pri lg" href="#library">Explore the library →</a><small>Educational only · not investment advice</small></div></section>';
}

function viewLibrary(){
  var list=MODELS.filter(function(m){return state.cat==='All'||m.cat===state.cat;});
  if(state.sort!=='featured')list=list.slice().sort(function(a,b){
    if(state.sort==='risk')return a.risk-b.risk||a.name.localeCompare(b.name);
    if(state.sort==='effort')return a.effort-b.effort||a.name.localeCompare(b.name);
    return b.growth-a.growth||a.name.localeCompare(b.name);});
  var chips=['All'].concat(CATS).map(function(c){return '<button class="chip" data-chip="'+esc(c)+'" aria-pressed="'+(state.cat===c)+'">'+esc(c)+'</button>';}).join('');
  var opts=[['featured','Featured'],['risk','Lowest risk'],['effort','Lowest effort'],['growth','Highest growth']].map(function(o){return '<option value="'+o[0]+'"'+(state.sort===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('');
  return '<div class="wrap"><div class="phead"><h1 class="display">The library.</h1><p class="sub">Investing models, each with an example portfolio you can explore.</p></div>'+
   '<div class="filters"><div class="chips" role="group" aria-label="Filter by family">'+chips+'</div><label class="sortw">Sort: <select id="sort">'+opts+'</select></label></div>'+
   '<div class="grid3" style="padding-bottom:100px">'+(list.length?list.map(card).join(''):'<p class="empty">No models in this family yet.</p>')+'</div></div>';
}

function donut(m){
  var R=45,C=2*Math.PI*R,cum=0,s='<svg viewBox="0 0 120 120" role="img" aria-label="Allocation of '+esc(m.name)+'"><circle cx="60" cy="60" r="'+R+'" fill="none" stroke="#ebe7dd" stroke-width="26"/>';
  var tot=m.hold.reduce(function(a,h){return a+h[2];},0);
  m.hold.forEach(function(h,i){var len=h[2]/tot*C;s+='<circle cx="60" cy="60" r="'+R+'" fill="none" stroke="'+HC[i%HC.length]+'" stroke-width="26" stroke-dasharray="'+Math.max(0,len-1.2)+' '+(C-Math.max(0,len-1.2))+'" stroke-dashoffset="'+(-cum)+'"/>';cum+=len;});
  return '<div class="donut">'+s+'</svg><div class="mid"><b>'+m.hold.length+'</b><span>holdings</span></div></div>';
}
function holdRows(m){
  var amt=Number(state.amount)||0,U=unlocked(),LK='<span class="lk">\u2022\u2022\u2022</span>';
  return m.hold.map(function(x,i){var st=stats(x[0]);
    return '<tr><td><div class="hn"><i style="background:'+HC[i%HC.length]+'"></i><div><b>'+esc(x[0])+'</b><span>'+esc(x[1])+' · '+esc(x[3])+'</span></div></div></td><td class="m">'+pctTxt(x[2])+'</td><td>'+money(amt*x[2]/100)+'</td><td>'+(!U?LK:(st?'$'+st.last.toFixed(2):'n/a'))+'</td><td class="m">'+(!U?LK:(st?chg(st.d1):'n/a'))+'</td><td class="m">'+(!U?LK:(st?chg(st.ytd,1):'n/a'))+'</td></tr>';}).join('');
}
function viewModel(id){
  var m=byId[id];if(!m)return viewLibrary();
  var idx=MODELS.indexOf(m),prev=MODELS[(idx+MODELS.length-1)%MODELS.length],next=MODELS[(idx+1)%MODELS.length];
  var inCmp=state.compare.indexOf(m.id)>-1,ms=modelStats(m);
  var cells=ms?[['1D',ms.d1],['1W',ms.w1],['MTD',ms.mtd],['YTD',ms.ytd],['~1Y',ms.y1]]:[];
  var perf=ms?'<div class="perf">'+cells.map(function(c){return '<div class="pt '+sign(c[1])+'"><small>'+c[0]+'</small><b class="'+(sign(c[1])==='na'?'':sign(c[1]))+'">'+fmt(c[1],c[0]==='1D'||c[0]==='1W'||c[0]==='MTD'?2:1)+'</b></div>';}).join('')+'</div>':'';
  var note='Fixed weights, price only. Excludes dividends, fees and rebalancing. Not a backtest.'+(ms&&ms.cov<99.9?' Covers '+ms.cov.toFixed(0)+'% of the portfolio; holdings without a ticker are left out.':'');
  return '<div class="wrap"><div class="mhead"><div class="crumb"><a href="#library">Library</a> &nbsp;/&nbsp; '+esc(m.cat)+'</div><h1>'+esc(m.name)+'</h1><p class="sub">'+esc(m.tag)+'</p>'+
   '<div class="facts"><div class="fact"><small>Horizon</small><b>'+esc(m.horizon)+'</b></div><div class="fact"><small>Turnover</small><b>'+esc(m.turnover)+'</b></div><div class="fact"><small>Risk</small>'+dots(m.risk,'p big')+'</div><div class="fact"><small>Effort</small>'+dots(m.effort,'p big')+'</div></div></div>'+
   '<div class="stack">'+
   (unlocked()?'<div class="panel sh"><div class="ph"><h2 style="font-size:22px">Price change of the example portfolio</h2>'+badge()+'</div>'+perf+'<p class="note">'+esc(note)+'</p></div>':gatePanel('See live price changes','Enter your email to unlock free price snapshots, the Compare tool and Find your fit.','model'))+
   '<div class="two"><div class="panel" style="background:var(--lilac)"><h2>The belief</h2><p class="b">'+esc(m.belief)+'</p><p class="note" style="margin:0">'+esc(m.origin)+'</p></div>'+
   '<div class="panel"><h2>How it works</h2>'+m.steps.map(function(s,i){return '<div class="nstep"><i>'+(i+1)+'</i><span>'+esc(s)+'</span></div>';}).join('')+'</div></div>'+
   '<div class="panel sh" style="padding:36px"><div class="ph"><div><h2>Example portfolio</h2><p class="note" style="margin-top:6px">Hypothetical and for illustration only. Weights add to 100%.</p></div><label class="calc" for="amt">If I invested <span>$</span><input id="amt" type="number" inputmode="numeric" min="0" step="500" value="'+state.amount+'"></label></div>'+
   '<div class="pb">'+donut(m)+'<div class="tw"><table><thead><tr><th>HOLDING</th><th>WEIGHT</th><th>AMOUNT</th><th>PRICE</th><th>1D</th><th>YTD</th></tr></thead><tbody id="hold">'+holdRows(m)+'</tbody></table></div></div></div>'+
   '<div class="two pc-wrap"><div class="panel pc g"><h3>Strengths</h3><ul>'+m.pros.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul></div><div class="panel pc r"><h3>Risks and criticisms</h3><ul>'+m.cons.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul></div></div>'+
   '<div class="two"><div class="panel wb"><h3>Works best when</h3><p>'+esc(m.best)+'</p><h3 style="margin-top:6px">Struggles when</h3><p>'+esc(m.worst)+'</p></div>'+
   '<div class="panel wb" style="background:var(--lilac)"><h3>Who it suits</h3><p>'+esc(m.suits)+'</p><div class="btns"><button class="btn pri sm" data-cmp="'+m.id+'" aria-pressed="false">'+(inCmp?'In comparison ✓':'Add to compare')+'</button><a class="btn light sm" href="#compare">Open compare</a></div></div></div>'+
   '<div class="pager"><a class="btn light" href="#m-'+prev.id+'">← '+esc(prev.name)+'</a><a class="btn light" href="#m-'+next.id+'">'+esc(next.name)+' →</a></div></div></div>';
}

function rankFit(){
  var f=state.fit,names={risk:'risk',effort:'effort',growth:'growth'};
  return MODELS.map(function(m){
    var d={risk:Math.abs(m.risk-f.risk),effort:Math.abs(m.effort-f.effort),growth:Math.abs(m.growth-f.growth)};
    var tot=Math.sqrt(d.risk*d.risk+d.effort*d.effort+d.growth*d.growth);
    var ks=Object.keys(d).sort(function(a,b){return d[a]-d[b];});
    var why=tot===0?'Matches your profile exactly':'Closest on '+names[ks[0]]+' and '+names[ks[1]];
    if(d[ks[2]]>=2)why+='; '+(ks[2]==='effort'?(m.effort>f.effort?'more effort than you want':'less effort than you want'):ks[2]==='risk'?(m.risk>f.risk?'higher risk than you want':'lower risk than you want'):(m.growth>f.growth?'more growth than you want':'less growth than you want'));
    return {m:m,tot:tot,why:why};
  }).sort(function(a,b){return a.tot-b.tot;}).slice(0,3);
}
function rankHtml(){
  var bg=['peach','yellow','mint'];
  return rankFit().map(function(r,i){return '<a class="rk" href="#m-'+r.m.id+'"><span class="n" style="background:var(--'+bg[i]+')">'+(i+1)+'</span><div><b>'+esc(r.m.name)+'</b><span class="w">'+esc(r.why)+'</span></div><span class="v">View →</span></a>';}).join('');
}
function slider(k,label,val){return '<div class="sl"><label for="s-'+k+'">'+label+'<span id="v-'+k+'">'+val+'/5</span></label><input type="range" id="s-'+k+'" data-fit="'+k+'" min="1" max="5" step="1" value="'+val+'" style="--p:'+((val-1)*25)+'%"></div>';}
function viewCompare(){
  if(!unlocked())return '<div class="wrap"><div class="phead"><h1 class="display">Compare models.</h1><p class="sub">Line up to four philosophies side by side.</p></div><div class="cgate">'+gatePanel('Unlock Compare','Free with your email. You also get price snapshots on every model and a weekly email about one model.','compare')+'</div></div>';
  var sel=state.compare.map(function(id){return byId[id];}).filter(Boolean);
  var chips=sel.map(function(m){return '<button class="cp" data-cmp="'+m.id+'" aria-label="Remove '+esc(m.name)+'">'+esc(m.name)+' <i>✕</i></button>';}).join('');
  var rest=MODELS.filter(function(m){return state.compare.indexOf(m.id)<0;});
  var menu=(state.menu&&rest.length&&sel.length<MAXCMP)?'<div class="menu" role="menu">'+rest.map(function(m){return '<button role="menuitem" data-cmp="'+m.id+'">'+esc(m.name)+'</button>';}).join('')+'</div>':'';
  var addBtn=sel.length<MAXCMP?'<button class="addm" data-menu="1" aria-expanded="'+(!!state.menu)+'">+ Add model</button>':'';
  var rows=[['Category',function(m){return esc(m.cat);}],['Horizon',function(m){return esc(m.horizon);}],['Risk',function(m){return dots(m.risk,'p');}],['Effort',function(m){return dots(m.effort,'p');}],['Growth',function(m){return dots(m.growth,'p');}],
   ['Price change · 1D',function(m){var s=modelStats(m);return s?'<span class="v">'+chg(s.d1)+'</span>':'n/a';}],['Price change · YTD',function(m){var s=modelStats(m);return s?'<span class="v">'+chg(s.ytd,1)+'</span>':'n/a';}],['Best when',function(m){return esc(m.best);}]];
  var table=sel.length<2?'<div class="panel">Choose at least two models to compare.</div>':
   '<div class="ct"><table><thead><tr><th></th>'+sel.map(function(m){return '<th><a href="#m-'+m.id+'">'+esc(m.name)+'</a></th>';}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr><td>'+r[0]+'</td>'+sel.map(function(m){return '<td>'+r[1](m)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>'+
   '<p class="note">Price changes are fixed-weight price returns'+(DATA?' as of the '+asOfTxt()+' close':'')+'. Ratings are editorial.</p>';
  var f=state.fit;
  return '<div class="wrap"><div class="phead"><h1 class="display">Compare models.</h1><p class="sub">Line up to four philosophies side by side.</p></div>'+
   '<div class="sel"><span>Comparing</span>'+chips+addBtn+menu+'</div>'+table+
   '<div class="fit" style="margin:28px 0 100px"><div><h2>Find your fit</h2><p>Tell us how you invest and we will rank the library.</p>'+slider('risk','Risk tolerance',f.risk)+slider('effort','Effort you will spend',f.effort)+slider('growth','Growth you want',f.growth)+'</div>'+
   '<div class="bm"><small>BEST MATCHES</small><div id="rank">'+rankHtml()+'</div></div></div></div>';
}

function viewAbout(){
  return '<div class="wrap"><div class="phead"><h1 class="display">About ModelLab.</h1><p class="sub">Investing philosophies, made understandable.</p></div><div class="about">'+
   '<div class="panel" style="background:var(--lilac)"><h2>Why it exists</h2><p class="b">Terms like value, momentum and all-weather get thrown around, but it is hard to see what each one looks like as a real portfolio. ModelLab shows the belief behind each style, the rules, and an example allocation, so you can understand the tradeoffs before you decide anything.</p></div>'+
   '<div class="panel"><h2>What you can do here</h2><ul><li>Read how each investing model thinks, in plain language.</li><li>See an example portfolio, its weights, and a dollar calculator.</li><li>Check price snapshots from the latest close.</li><li>Compare models side by side and find the ones closest to how you think about risk.</li></ul></div>'+
   '<div class="panel"><h2>How it can help you</h2><ul><li>Learn faster, without jargon.</li><li>Understand what each style asks of you in risk and effort.</li><li>Free to browse, no signup, nothing to buy.</li></ul></div>'+
   '<div class="panel" style="background:var(--peach)"><h2>The fine print</h2><p class="b">ModelLab is an educational project by Daniel Kang. Every allocation is a hypothetical example using public funds. Nothing here is investment advice, a recommendation, or a record of performance. Price changes are price only and exclude dividends, fees and rebalancing. Risk, effort and growth ratings are editorial judgments, not measured data.</p></div></div></div>';
}

/* ---------- router and events ---------- */
var view=$('#view'),foot=$('#foot');
function render(keep){
  var hash=(location.hash||'#home').slice(1),html,nav='',home=false;
  if(hash==='library'){html=viewLibrary();nav='library';}
  else if(hash==='compare'){html=viewCompare();nav='compare';}
  else if(hash==='about'){html=viewAbout();}
  else if(hash.indexOf('m-')===0){html=viewModel(hash.slice(2));nav='library';}
  else{html=viewHome();home=true;}
  view.innerHTML=html;foot.innerHTML=(home?'':'')+footer(home);
  document.body.classList.toggle('home',home);
  document.querySelectorAll('[data-nav]').forEach(function(a){a.classList.toggle('on',a.getAttribute('data-nav')===nav);});
  if(!keep)window.scrollTo(0,0);
}
function rerender(){var y=window.scrollY;render(true);window.scrollTo(0,y);}
document.addEventListener('click',function(e){
  var t=e.target;
  var chip=t.closest('[data-chip]');if(chip){state.cat=chip.getAttribute('data-chip');rerender();return;}
  var st=t.closest('[data-step]');if(st){state.step=Number(st.getAttribute('data-step'));rerender();return;}
  var mn=t.closest('[data-menu]');if(mn){state.menu=!state.menu;rerender();return;}
  var cmp=t.closest('[data-cmp]');
  if(cmp){
    var id=cmp.getAttribute('data-cmp'),i=state.compare.indexOf(id);
    if(i>-1)state.compare.splice(i,1);else{if(state.compare.length>=MAXCMP)state.compare.shift();state.compare.push(id);}
    state.menu=false;rerender();return;
  }
  if(state.menu&&!t.closest('.menu')){state.menu=false;if(location.hash==='#compare')rerender();}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.hasAttribute&&t.hasAttribute('data-fit')){var k=t.getAttribute('data-fit');state.fit[k]=Number(t.value);t.style.setProperty('--p',((t.value-1)*25)+'%');$('#v-'+k).textContent=t.value+'/5';$('#rank').innerHTML=rankHtml();}
  if(t.id==='amt'){state.amount=Math.max(0,Number(t.value)||0);var id=(location.hash||'').slice(3);if(byId[id])$('#hold').innerHTML=holdRows(byId[id]);}
});
document.addEventListener('submit',function(e){
  var f=e.target.closest&&e.target.closest('form[data-signup]');if(!f)return;
  e.preventDefault();
  var email=(f.querySelector('input[name=email]').value||'').trim(),msg=f.parentNode.querySelector('.signup-msg'),btn=f.querySelector('button');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){msg.textContent='Please enter a valid email address.';return;}
  msg.textContent='';btn.disabled=true;btn.textContent='One moment\u2026';
  function done(){setUnlocked();rerender();}
  function fail(){btn.disabled=false;btn.textContent='Unlock free access \u2192';msg.textContent='Could not sign you up right now. Please try again.';}
  if(!SIGNUP.companyId||!SIGNUP.listId){console.warn('ModelLab: SIGNUP not configured, email was not saved.');done();return;}
  fetch('https://a.klaviyo.com/client/subscriptions/?company_id='+encodeURIComponent(SIGNUP.companyId),{
    method:'POST',headers:{'Content-Type':'application/json','revision':'2024-10-15'},
    body:JSON.stringify({data:{type:'subscription',attributes:{custom_source:'ModelLab site ('+f.getAttribute('data-signup')+')',profile:{data:{type:'profile',attributes:{email:email}}}},relationships:{list:{data:{type:'list',id:SIGNUP.listId}}}}})
  }).then(function(r){if(r.status===202||r.ok)done();else fail();}).catch(fail);
});
document.addEventListener('change',function(e){if(e.target.id==='sort'){state.sort=e.target.value;rerender();}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&state.menu){state.menu=false;rerender();}});
window.addEventListener('hashchange',function(){state.menu=false;render();});
render();
loadLive();
})();
</script>

  var m=d.m||[];

function modelStats(m){
  var keys=['d1','w1','mtd','ytd','y1'],out={cov:0};
  keys.forEach(function(k){out[k]=0;});
  m.hold.forEach(function(x){var st=stats(x[0]);if(!st)return;out.cov+=x[2];keys.forEach(function(k){out[k]+=x[2]*st[k];});});
  if(!out.cov)return null;
  keys.forEach(function(k){out[k]=out[k]/out.cov;});
  ['y5','y10'].forEach(function(k){var w=0,s=0;m.hold.forEach(function(x){var st=stats(x[0]);if(!st||st[k]==null||isNaN(st[k]))return;w+=x[2];s+=x[2]*st[k];});out[k]=(w>=out.cov-0.05&&w>0)?s/w:null;});
  return out;
}

function donut(m){

  var tot=m.hold.reduce(function(a,h){return a+h[2];},0);
  m.hold.forEach(function(h,i){var len=h[2]/tot*C;s+='<circle cx="60" cy="60" r="'+R+'" fill="none" stroke="'+HC[i%HC.length]+'" stroke-width="26" stroke-dasharray="'+Math.max(0,len-1.2)+' '+(C-Math.max(0,len-1.2))+'" stroke-dashoffset="'+(-cum)+'"/>';cum+=len;});
  return '<div class="donut">'+s+'</svg><div class="mid"><b>'+m.hold.length+'</b><span>holdings</span></div></div>';
}

function rankFit(){
  var f=state.fit,names={risk:'risk',effort:'effort',growth:'growth'};
  return MODELS.map(function(m){
    var d={risk:Math.abs(m.risk-f.risk),effort:Math.abs(m.effort-f.effort),growth:Math.abs(m.growth-f.growth)};
    var tot=Math.sqrt(d.risk*d.risk+d.effort*d.effort+d.growth*d.growth);
    var ks=Object.keys(d).sort(function(a,b){return d[a]-d[b];});
    var why=tot===0?'Matches your profile exactly':'Closest on '+names[ks[0]]+' and '+names[ks[1]];
    if(d[ks[2]]>=2)why+='; '+(ks[2]==='effort'?(m.effort>f.effort?'more effort than you want':'less effort than you want'):ks[2]==='risk'?(m.risk>f.risk?'higher risk than you want':'lower risk than you want'):(m.growth>f.growth?'more growth than you want':'less growth than you want'));
    return {m:m,tot:tot,why:why};
  }).sort(function(a,b){return a.tot-b.tot;}).slice(0,3);
}

  var bg=['peach','yellow','mint'];
  return rankFit().map(function(r,i){return '<a class="rk" href="#m-'+r.m.id+'"><span class="n" style="background:var(--'+bg[i]+')">'+(i+1)+'</span><div><b>'+esc(r.m.name)+'</b><span class="w">'+esc(r.why)+'</span></div><span class="v">View →</span></a>';}).join('');
}

  var menu=(state.menu&&rest.length&&sel.length<MAXCMP)?'<div class="menu" role="menu">'+rest.map(function(m){return '<button role="menuitem" data-cmp="'+m.id+'">'+esc(m.name)+'</button>';}).join('')+'</div>':'';
  var addBtn=sel.length<MAXCMP?'<button class="addm" data-menu="1" aria-expanded="'+(!!state.menu)+'">+ Add model</button>':'';
  var rows=[['Category',function(m){return esc(m.cat);}],['Horizon',function(m){return esc(m.horizon);}],['Risk',function(m){return dots(m.risk,'p');}],['Effort',function(m){return dots(m.effort,'p');}],['Growth',function(m){return dots(m.growth,'p');}],

document.addEventListener('click',function(e){
  var t=e.target;
  var glb=t.closest&&t.closest('.gl');if(glb){glOpen(glb);return;}if(glPop&&!(t.closest&&t.closest('.gl-pop')))glClose();
  var ln=t.closest&&t.closest('a[href]');
  if(ln&&!ln.target&&e.button===0&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey){var hr=ln.getAttribute('href'),u=new URL(ln.href,location.href);
    if(hr==='#follow-cta'){e.preventDefault();state.bell=false;paintBell();var fc=document.getElementById('follow');if(fc){fc.scrollIntoView({behavior:'smooth',block:'center'});var fi=fc.querySelector('input');if(fi)setTimeout(function(){fi.focus({preventScroll:true});},400);}else go('#about');return;}
    if(hr.charAt(0)==='#'&&hr.length>1){e.preventDefault();go(hr);return;}
    if(u.origin===location.origin&&u.pathname.indexOf(BASE)===0&&!/\.[a-z0-9]+$/i.test(u.pathname)&&!u.hash){e.preventDefault();go(fromPath(decodeURIComponent(u.pathname).slice(BASE.length)));return;}}
  var bdb=t.closest('[data-bd]');if(bdb){var v=bdb.getAttribute('data-bd'),bb=state.bd;if(v==='go')bb.step=1;else if(v.indexOf('goal:')===0){bb.goal=v.slice(5);bb.step=2;}else if(v.indexOf('freq:')===0){bb.freq=v.slice(5);bb.step=3;}rerender();var ch=document.querySelector('.bd-chat');if(ch)ch.lastElementChild.scrollIntoView({block:'nearest'});return;}
  var bl=t.closest('[data-bell]');if(bl){state.bell=!state.bell;try{localStorage.setItem('ml_bell','1');}catch(x){}paintBell();return;}
  if(state.bell&&!t.closest('.bell-pop')){state.bell=false;paintBell();}
  var pl=t.closest('[data-poll]');if(pl){var pp=pl.getAttribute('data-poll').split('|');try{localStorage.setItem(pp[0],pp[1]);}catch(x){}rerender();return;}
  var cb=t.closest('[data-carb]');if(cb){var cr=cb.closest('.post').querySelector('.car');cr.scrollBy({left:Number(cb.getAttribute('data-carb'))*cr.clientWidth,behavior:'smooth'});return;}
  var sn=t.closest('[data-seen]');if(sn){try{var sv=JSON.parse(localStorage.getItem('ml_seen')||'{}');sv[sn.getAttribute('data-seen')]=1;localStorage.setItem('ml_seen',JSON.stringify(sv));}catch(x){}}
  var chip=t.closest('[data-chip]');if(chip){state.cat=chip.getAttribute('data-chip');rerender();return;}var tr=t.closest('[data-tier]');if(tr){state.tier=tr.getAttribute('data-tier');rerender();return;}var srt=t.closest('[data-sort]');if(srt){state.sort=srt.getAttribute('data-sort');rerender();return;}
  var st=t.closest('[data-step]');if(st){state.step=Number(st.getAttribute('data-step'));rerender();return;}
  var mn=t.closest('[data-menu]');if(mn){state.menu=!state.menu;rerender();return;}
  var cmp=t.closest('[data-cmp]');
  if(cmp){
    var id=cmp.getAttribute('data-cmp'),i=state.compare.indexOf(id);
    if(i>-1)state.compare.splice(i,1);else{if(state.compare.length>=MAXCMP)state.compare.shift();state.compare.push(id);}
    state.menu=false;rerender();return;
  }
  if(state.menu&&!t.closest('.menu')){state.menu=false;if(curH()==='#compare')rerender();}
});
document.addEventListener('scroll',function(e){var c=e.target;if(!c.classList||!c.classList.contains('car'))return;var n=c.children.length,i=Math.round(c.scrollLeft/c.clientWidth),p=c.closest('.post');p.querySelectorAll('.car-dots i').forEach(function(d,k){d.classList.toggle('on',k===i);});p.querySelector('.car-c').textContent=(i+1)+'/'+n;},true);
function paintBell(){var w=document.getElementById('bellw');if(w)w.innerHTML=bellHtml();}
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.hasAttribute&&t.hasAttribute('data-fit')){var k=t.getAttribute('data-fit');state.fit[k]=Number(t.value);t.style.setProperty('--p',((t.value-1)*25)+'%');$('#v-'+k).textContent=t.value+'/5';$('#rank').innerHTML=rankHtml();}
  if(t.id==='amt'){state.amount=Math.max(0,Number(t.value)||0);var id=curH().slice(3);if(byId[id]){$('#hold').innerHTML=holdRows(byId[id]);var cr=$('#calcres');if(cr)cr.innerHTML=valueInner(byId[id]);}}
});
document.addEventListener('submit',function(e){
  if(e.target.closest&&e.target.closest('form[data-bdform]')){e.preventDefault();bdSubmit();return;}
  var f=e.target.closest&&e.target.closest('form[data-signup]');if(!f)return;
  e.preventDefault();
  var email=(f.querySelector('input[name=email]').value||'').trim(),msg=f.parentNode.querySelector('.signup-msg'),btn=f.querySelector('button');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){msg.textContent='Please enter a valid email address.';return;}
  msg.textContent='';btn.disabled=true;btn.textContent='One moment\u2026';
  function done(){try{localStorage.setItem('ml_email',email);}catch(x){}setUnlocked();rerender();}
  function fail(){btn.disabled=false;btn.textContent='follow @modellab \u2192';msg.textContent='Could not sign you up right now. Please try again.';}
  if(!SIGNUP.companyId||!SIGNUP.listId){console.warn('ModelLab: SIGNUP not configured, email was not saved.');done();return;}
  fetch('https://a.klaviyo.com/client/subscriptions/?company_id='+encodeURIComponent(SIGNUP.companyId),{
    method:'POST',headers:{'Content-Type':'application/json','revision':'2024-10-15'},
    body:JSON.stringify({data:{type:'subscription',attributes:{custom_source:'ModelLab site ('+f.getAttribute('data-signup')+')',profile:{data:{type:'profile',attributes:{email:email}}}},relationships:{list:{data:{type:'list',id:SIGNUP.listId}}}}})
  }).then(function(r){if(r.status===202||r.ok)done();else fail();}).catch(fail);
});
document.addEventListener('change',function(e){if(e.target.id==='sort'){state.sort=e.target.value;rerender();}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')glClose();if(e.key==='Escape'&&state.menu){state.menu=false;rerender();}});
window.addEventListener('hashchange',function(){if(location.hash.length>1){history.replaceState(null,'',BASE+toPath(location.hash));}state.menu=false;render();});
window.addEventListener('popstate',function(){state.menu=false;render();});
window.ML={av:av,handle:handle,LOGO:LOGO,MODELS:MODELS,byId:byId,routes:ROUTES,routeFor:routeFor,data:function(){return DATA;},srcTxt:srcTxt,unlocked:unlocked,gatePanel:gatePanel,rerender:rerender,signup:SIGNUP,curH:curH,go:go,esc:esc,money:money,fmt:fmt,chg:chg,sign:sign,$:$};
render();
loadLive();
})();
</script>

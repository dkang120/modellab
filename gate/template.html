<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>ModelLab</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid #eee;
            }

            .staticrypt-page {
                width: 360px;
                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #ffffff;
                max-width: 360px;
                margin: 0 auto 100px;
                padding: 45px;
                text-align: center;
                box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.2), 0 5px 5px 0 rgba(0, 0, 0, 0.24);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box; /* This ensures padding is included in the total width */
                font-size: 14px;
                outline: 0;
                padding: 15px 30px 15px 15px; /* Adjust the padding to ensure there is space for the icon */
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #f2f2f2;
                width: 100%;
                border: 0;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: /*[|template_color_primary|]*/ 0;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: /*[|template_color_primary|]*/ 0;
                filter: brightness(92%);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: /*[|template_color_secondary|]*/ 0;
                font-family: "Arial", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-size: 1.5em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.5);
                margin-right: 1em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }

            /* ModelLab gate: night card, matches the Figma password frame */
            html.staticrypt-html,body.staticrypt-body{background:#171614!important;color:#f2efe8;font-family:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif}
            .staticrypt-content{background:transparent!important;box-shadow:none!important;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;max-width:none!important;margin:0!important;width:100%!important}
            .staticrypt-page{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:28px}
            .ml-logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;letter-spacing:-.02em;color:#f2efe8}
            .ml-logo svg{width:26px;height:26px}
            .staticrypt-form{width:100%;background:#26241f;border-radius:24px;padding:36px;display:flex;flex-direction:column;gap:18px;align-items:stretch;text-align:center}

            .staticrypt-form .staticrypt-title{font-size:30px!important;font-weight:700!important;letter-spacing:-.03em;margin:0 0 12px!important;color:#f2efe8!important;opacity:1!important}
            .staticrypt-instructions p{color:rgba(242,239,232,.65);font-size:15px;line-height:1.5;margin:0}
            .staticrypt-hr{display:none!important}
            .staticrypt-password-container{position:relative;background:transparent!important;border-radius:14px}
            .staticrypt-form input[type="password"],.staticrypt-form input[type="text"]{width:100%;box-sizing:border-box;background:#171614!important;border:1.5px solid rgba(242,239,232,.15)!important;border-radius:14px!important;color:#f2efe8!important;font:inherit;font-size:16px;padding:16px 48px 16px 18px!important;outline:0}
            .staticrypt-form input[type="password"]:focus,.staticrypt-form input[type="text"]:focus{border-color:#7c4def!important}
            .staticrypt-form input::placeholder{color:rgba(242,239,232,.45)}
            .staticrypt-toggle-password-visibility{filter:invert(1);opacity:.55;width:20px;height:20px;position:absolute;right:16px;top:50%;transform:translateY(-50%);cursor:pointer}
            .staticrypt-form .staticrypt-decrypt-button{text-transform:none!important;width:100%!important;box-sizing:border-box;margin:6px 0 0!important;background:#7c4def!important;color:#fff!important;font:inherit;font-weight:600;font-size:16px;border:0!important;border-bottom:4px solid #5b33c9!important;border-radius:999px!important;padding:16px!important;cursor:pointer}
            .staticrypt-form .staticrypt-decrypt-button:hover{filter:brightness(1.06)}
            .ml-note{font-size:13px;color:rgba(242,239,232,.5);margin-top:4px}
            .ml-foot{font-size:13px;color:rgba(242,239,232,.4)}
            .staticrypt-remember{color:rgba(242,239,232,.6);font-size:14px}
        </style>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">

        <script>

                staticryptConfig = /*[|staticrypt_config|]*/ 0;

                rememberExpirationKey: "staticrypt_expiration",
                rememberPassphraseKey: "staticrypt_passphrase",
                replaceHtmlCallback: null,
                clearLocalStorageCallback: null,
            };

            // init the staticrypt engine
            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

            // try to automatically decrypt on load if there is a saved password
            window.onload = async function () {
                const { isSuccessful } = await staticrypt.handleDecryptOnLoad();

                // if we didn't decrypt anything on load, show the password prompt. Otherwise the content has already been
                // replaced, no need to do anything
                if (!isSuccessful) {
                    // hide loading screen
                    document.getElementById("staticrypt_loading").classList.add("hidden");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    document.getElementById("staticrypt-password").focus();

                    if (isRememberEnabled) {
                        document.getElementById("staticrypt-remember-label").classList.remove("hidden");
                    }

                    toggleIcon.alt = templateToggleAltHide;
                    toggleIcon.title = templateToggleAltHide;

                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;

            // handle password form submission
            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

# ModelLab AI text buddy (Cloudflare Worker).
# Workers Builds: root dir = buddy, deploy = npx wrangler deploy
# Deployed automatically by Cloudflare Workers Builds from this folder on every push to main.
name = "modellab-buddy"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Reply counters + short chat history. No id: Cloudflare creates the namespace on first deploy.
[[kv_namespaces]]
binding = "BUDDY_KV"

[vars]
MODEL = "claude-sonnet-5-5"
# Klaviyo free plan = 150 SMS credits/month shared with the scheduled texts.
# The AI may use at most this many credits a month; scheduled texts keep the rest.
MONTHLY_CREDIT_CAP = "80"
PER_PERSON_MONTHLY = "6"
# Plans: free = 4 AI replies a month, pro ($4.99/mo via Stripe) = 100, owner numbers = unlimited.
FREE_MONTHLY = "4"
PRO_MONTHLY = "100"
# Launch promo: unlimited replies for everyone until this moment (Dec 2, 2026 00:00 Pacific = 08:00 UTC),
# then free = FREE_MONTHLY again automatically. PROMO_FAIR_USE is a hidden anti-abuse ceiling per number per month.
PROMO_UNTIL = "2026-12-02T08:00:00Z"
PROMO_FAIR_USE = "300"
OWNER_PHONES = "+19256780687"
# Email Daniel when pro/owner replies pass this many SMS credits in a month (time to add Klaviyo credits).
PAID_CREDIT_ALERT = "50"
# Stripe Payment Link for the $4.99/mo plan (set once Stripe is set up). Secret STRIPE_WEBHOOK_SECRET goes in Cloudflare.
STRIPE_PAYMENT_LINK = "https://buy.stripe.com/28E6oG8tq7caaez58Z7bW01"
ALERT_EMAIL = "kangd4u@gmail.com"
# Smart first-move texts (payday etc.): at most this many a day across everyone.
MAX_NUDGES_PER_DAY = "10"

# Secrets (set in the Cloudflare dashboard, never in this file):
#   ANTHROPIC_API_KEY  - Claude API key
#   KLAVIYO_BUDDY_KEY  - Klaviyo private key with Events: Full access
#   BUDDY_SECRET       - shared secret Klaviyo sends in the x-buddy-secret header

# Daily first-move texts at 17:30 UTC (9:30am PST / 10:30am PDT).
[triggers]
crons = ["30 17 * * *"]

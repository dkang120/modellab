name: Simulated user test

# Run from your phone: repo → Actions → "Simulated user test" → Run workflow.
# AI personas text the buddy (same prompt/model as production). No texts are sent; no Klaviyo credits used.
# Spend is capped across ALL runs by the budget input (tracked in a ledger kept in the Actions cache).

on:
  # Claude starts runs by pushing simtest/queue.json to the simtest-dev branch.
  push:
    branches: [simtest-dev]
    paths: [simtest/queue.json]
  workflow_dispatch:
    inputs:
      name:
        description: 'Run name (reuse a name to resume it)'
        default: 'pilot'
      total:
        description: 'Number of conversations'
        default: '30'
      budget:
        description: 'Max total spend in USD across all runs'
        default: '3'
      turns:
        description: 'Max texts per side in each conversation'
        default: '6'

permissions:
  contents: write

concurrency:
  group: simtest
  cancel-in-progress: false

jobs:
  simtest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Missing secret ANTHROPIC_API_KEY. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Restore ledger and saved runs
        uses: actions/cache/restore@v4
        with:
          path: simtest-out
          key: simtest-${{ github.run_id }}
          restore-keys: simtest-

      - name: Pick settings
        id: cfg
        env:
          IN_NAME: ${{ inputs.name }}
          IN_TOTAL: ${{ inputs.total }}
          IN_BUDGET: ${{ inputs.budget }}
          IN_TURNS: ${{ inputs.turns }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            node -e 'const q=require("./simtest/queue.json");const o=require("fs");o.appendFileSync(process.env.GITHUB_OUTPUT,`name=${q.name}\ntotal=${q.total}\nbudget=${q.budget}\nturns=${q.turns||6}\nseed=${q.seed||2026}\nmode=${q.mode||"auto"}\n`)'
          else
            printf 'name=%s\ntotal=%s\nbudget=%s\nturns=%s\nseed=2026\nmode=auto\n' "$IN_NAME" "$IN_TOTAL" "$IN_BUDGET" "$IN_TURNS" >> "$GITHUB_OUTPUT"
          fi

      - name: Git identity
        run: |
          git config user.name "modellab-simtest"
          git config user.email "simtest@users.noreply.github.com"

      - name: Run simulated conversations
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_NAME: ${{ steps.cfg.outputs.name }}
          TOTAL: ${{ steps.cfg.outputs.total }}
          BUDGET: ${{ steps.cfg.outputs.budget }}
          TURNS: ${{ steps.cfg.outputs.turns }}
          SEED: ${{ steps.cfg.outputs.seed }}
          MODE: ${{ steps.cfg.outputs.mode }}
        run: node simtest/run.mjs --name "$RUN_NAME" --total "$TOTAL" --budget "$BUDGET" --turns "$TURNS" --seed "$SEED" --mode "$MODE" --out simtest-out --progress

      - name: Save ledger and runs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: simtest-out
          key: simtest-${{ github.run_id }}

      - name: Show report
        if: always()
        env:
          RUN_NAME: ${{ steps.cfg.outputs.name }}
        run: |
          if [ -f "simtest-out/$RUN_NAME/report.md" ]; then cat "simtest-out/$RUN_NAME/report.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Commit report to the repo
        if: always()
        env:
          RUN_NAME: ${{ steps.cfg.outputs.name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          [ -f "simtest-out/$RUN_NAME/report.md" ] || exit 0
          mkdir -p "simtest/results/$RUN_NAME"
          cp "simtest-out/$RUN_NAME/report.md" "simtest-out/$RUN_NAME/dataset.jsonl" "simtest/results/$RUN_NAME/"
          cp simtest-out/ledger.json simtest/results/ledger.json
          git config user.name "modellab-simtest"
          git config user.email "simtest@users.noreply.github.com"
          git add simtest/results
          git diff --cached --quiet && exit 0
          git commit -m "simtest: $RUN_NAME report [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin "$BRANCH" && git push -q origin "HEAD:$BRANCH" && break; sleep 5; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simtest-${{ steps.cfg.outputs.name }}
          path: simtest-out/${{ steps.cfg.outputs.name }}

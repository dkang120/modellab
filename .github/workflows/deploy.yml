name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 22 * * 1-5"   # weekdays after the US market close
  workflow_dispatch:
    inputs:
      dip_test:
        description: 'Create (not send) a test dip campaign in Klaviyo'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Refresh prices. If the fetch fails, the committed data.json snapshot is used instead.
      - name: Refresh prices
        continue-on-error: true
        run: python3 scripts/update_data.py

      # Text buddy: auto-send the dip check-in when the S&P 500 is 5/10/20% below its 52-week high.
      - name: Text buddy dip check
        continue-on-error: true
        env:
          KLAVIYO_PRIVATE_KEY: ${{ secrets.KLAVIYO_PRIVATE_KEY }}
          DIP_TEST: ${{ inputs.dip_test }}
        run: python3 scripts/dip_check.py

      # Save the fresh prices to the repo. Keeps the fallback snapshot current and keeps the
      # repo active, so GitHub never pauses this schedule (it pauses after 60 days of no commits).
      - name: Save refreshed prices
        continue-on-error: true
        run: |
          git config user.name "modellab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json dip_state.json
          git diff --cached --quiet || (git commit -m "Refresh prices + dip check state [skip ci]" && git push)

      - name: Push prices to leaderboard
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/push_prices.py

      - name: Build
        run: ./build.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
